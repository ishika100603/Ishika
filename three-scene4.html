<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2D Canvas.4</title>
    <link rel="stylesheet" href="site-chat.css">
    <link rel="stylesheet" href="site-nav.css">
    <link rel="stylesheet" href="canvas-base.css">
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #f2f2f2;
            overflow: hidden;
        }

        body {
            position: relative;
            z-index: 1;
            background: #000;
        }

        .video-stage {
            position: fixed;
            top: var(--site-nav-height, 48px);
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .video-frame {
            width: 100%;
            height: 100%;
        }

        .video-frame canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
        }

        .video-caption {
            position: absolute;
            left: clamp(20px, 4vw, 48px);
            bottom: 20px;
            margin: 0;
            font-size: clamp(0.58rem, 1.1vw, 0.66rem);
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.32);
            text-align: left;
            line-height: 1.5;
            pointer-events: none;
        }
    </style>
</head>

<body class="has-canvas-base">
    <div class="canvas-base" aria-hidden="true"></div>

    <main class="video-stage" aria-label="2D Canvas.4 video">
        <div class="video-frame">
            <canvas id="canvas4-display" aria-hidden="true"></canvas>
            <video
                id="canvas4-video"
                src="canvas4-video/scene-video.mp4"
                autoplay
                muted
                loop
                playsinline
                preload="auto"
                aria-label="3D canvas video">
            </video>
        </div>
        <p class="video-caption">Art that feels alive</p>
    </main>

    <script src="canvas-video.js"></script>
    <script>
        mountCanvasVideo({ videoId: 'canvas4-video', canvasId: 'canvas4-display' });
    </script>
    <script src="site-nav.js"></script>
    <script src="site-chat.js"></script>
    <script src="chatbot.js"></script>
</body>

</html>
