<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2D Canvas.3</title>
    <link rel="stylesheet" href="site-chat.css">
    <link rel="stylesheet" href="site-nav.css">
    <link rel="stylesheet" href="canvas-base.css">
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #f2f2f2;
            overflow: hidden;
        }

        body {
            position: relative;
            z-index: 1;
            background: #000;
        }

        .video-stage {
            position: fixed;
            top: var(--site-nav-height, 48px);
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transform: translateY(calc((10px + 1lh) / -2));
        }

        .video-frame {
            flex: 0 0 auto;
        }

        .video-frame canvas {
            display: block;
            width: min(220px, 42vw);
            height: auto;
            background: #000;
        }

        .video-caption {
            margin: 0;
            flex: 0 0 auto;
            font-size: clamp(0.58rem, 1.1vw, 0.66rem);
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.32);
            text-align: center;
            line-height: 1.5;
            white-space: nowrap;
        }
    </style>
</head>

<body class="has-canvas-base">
    <div class="canvas-base" aria-hidden="true"></div>

    <main class="video-stage" aria-label="2D Canvas.3 video">
        <div class="video-stack">
            <div class="video-frame">
                <canvas id="canvas3-display" aria-hidden="true"></canvas>
                <video
                    id="canvas3-video"
                    src="canvas3-video/scene-video.mp4"
                    autoplay
                    muted
                    loop
                    playsinline
                    preload="auto"
                    aria-label="3D canvas video">
                </video>
            </div>
            <p class="video-caption">Art that feels real</p>
        </div>
    </main>

    <script src="canvas-video.js"></script>
    <script>
        mountCanvasVideo({ videoId: 'canvas3-video', canvasId: 'canvas3-display', small: true });
    </script>
    <script src="site-nav.js"></script>
    <script src="site-chat.js"></script>
    <script src="chatbot.js"></script>
</body>

</html>
