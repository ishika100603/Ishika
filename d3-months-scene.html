<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline</title>
  <link rel="stylesheet" href="site-back.css">
  <link rel="stylesheet" href="site-chat.css">
  <link rel="stylesheet" href="site-nav.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      height: 100vh;
    }

    header {
      position: fixed;
      top: var(--site-nav-height, 48px);
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 36px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    header h1 {
      font-size: 13px;
      letter-spacing: 4px;
      font-weight: 500;
      color: #f0f0f0;
    }

    header a {
      color: #f0f0f0;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 2px;
    }

    #months-container {
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }

    #months-container:active { cursor: grabbing; }

    #scroll-hint {
      position: fixed;
      bottom: 24px;
      left: 36px;
      font-size: 10px;
      letter-spacing: 3px;
      color: rgba(255, 255, 255, 0.35);
      pointer-events: none;
      z-index: 10;
    }

    svg { display: block; }
  </style>
</head>
<body>
  <a href="index.html" class="back-btn">← BACK</a>
  <header>
    <h1>TIMELINE</h1>
  </header>
  <div id="months-container"></div>
  <div id="scroll-hint">scroll to explore the most loved artworks</div>
  <script src="months-timeline.js"></script>
  <script src="site-nav.js"></script>
  <script src="site-chat.js"></script>
  <script src="chatbot.js"></script>
</body>
</html>
