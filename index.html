<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>creating art that outlives us</title>
  <link rel="stylesheet" href="site-back.css">
  <link rel="stylesheet" href="site-chat.css">
  <link rel="stylesheet" href="site-nav.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      cursor: default;
    }

    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      pointer-events: none;
    }

    #loading {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.45);
      font-size: 12px;
      letter-spacing: 3px;
      z-index: 100;
      transition: opacity 1.2s;
    }

    #hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.28);
      font-size: 10px;
      letter-spacing: 3px;
      pointer-events: none;
      z-index: 40;
    }

    #drive-panel {
      position: fixed;
      left: 24px;
      bottom: 24px;
      z-index: 60;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      background: rgba(8, 8, 8, 0.78);
      backdrop-filter: blur(10px);
      user-select: none;
    }

    #drive-note {
      max-width: 120px;
      font-size: 10px;
      line-height: 1.55;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
      pointer-events: none;
    }

    #drive-controller {
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(2, 52px);
      gap: 8px;
      touch-action: none;
    }

    .drive-btn {
      width: 52px;
      height: 52px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      color: #f2f2f2;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }

    .drive-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(142, 197, 255, 0.45);
    }

    .drive-btn.active {
      background: rgba(45, 124, 255, 0.35);
      border-color: rgba(142, 197, 255, 0.7);
      transform: scale(0.96);
    }

    .drive-btn.empty {
      visibility: hidden;
      pointer-events: none;
    }

    #drive-up { grid-column: 2; grid-row: 1; }
    #drive-left { grid-column: 1; grid-row: 2; }
    #drive-down { grid-column: 2; grid-row: 2; }
    #drive-right { grid-column: 3; grid-row: 2; }

    #landing-credit {
      position: fixed;
      top: calc(var(--site-nav-height, 48px) + 14px);
      left: 24px;
      z-index: 40;
      font-size: 11px;
      letter-spacing: 0.06em;
      color: #8a8a8a;
      pointer-events: none;
    }
  </style>
</head>

<body class="page-landing">
  <div id="landing-credit">Ishika Agrawal-MSCDP-GSAPP</div>
  <div id="loading">muse create - portfolio</div>
  <div id="hint">STEER TO EXPLORE OUR VISION</div>

  <div id="drive-panel" aria-label="Car controller">
    <p id="drive-note">Operate to discover our vision</p>
    <div id="drive-controller">
      <button type="button" class="drive-btn" id="drive-up" aria-label="Forward">▲</button>
      <button type="button" class="drive-btn" id="drive-left" aria-label="Steer left">◀</button>
      <button type="button" class="drive-btn" id="drive-down" aria-label="Reverse">▼</button>
      <button type="button" class="drive-btn" id="drive-right" aria-label="Steer right">▶</button>
    </div>
  </div>

  <script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
  }
}
</script>
  <script type="module">
    import * as THREE from 'three';
    import { FontLoader } from 'three/addons/loaders/FontLoader.js';
    import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

    // ── HELPERS (these were missing — p5.js functions don't exist here) ──
    function random(a, b) {
      if (a === undefined) return Math.random();
      if (b === undefined) return Math.random() * a;
      return a + Math.random() * (b - a);
    }
    function floor(v) { return Math.floor(v); }
    function max(...vals) { return Math.max(...vals); }

    // ── SCENE ──────────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.FogExp2(0x000000, 0.025);

    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 300);
    camera.position.set(0, 6, 18);
    camera.lookAt(0, 1, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);
    renderer.domElement.style.position = "fixed";
    renderer.domElement.style.top = "0";
    renderer.domElement.style.left = "0";
    renderer.domElement.style.zIndex = "0";
    renderer.domElement.style.pointerEvents = "none";

    scene.add(new THREE.AmbientLight(0xffffff, 0.0));

    // ── GROUND ─────────────────────────────────────────────────────────
    const road = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 600),
      new THREE.MeshStandardMaterial({ color: 0x0c0c0c, roughness: 1 })
    );
    road.rotation.x = -Math.PI / 2;
    road.receiveShadow = true;
    scene.add(road);

    const roadsideObjects = [];
    let debugRoadsideTimer = 4.0;

    const dashMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 1 });
    for (let i = -30; i < 30; i++) {
      const d = new THREE.Mesh(new THREE.PlaneGeometry(0.1, 6), dashMat);
      d.rotation.x = -Math.PI / 2;
      d.position.set(0, 0.01, i * 10);
      scene.add(d);
    }

    populateRoadsideArt();

    // ── CAR ────────────────────────────────────────────────────────────
    const car = new THREE.Group();
    scene.add(car);

    const carMat = new THREE.MeshStandardMaterial({ color: 0x08081a, roughness: 0.25, metalness: 0.85 });
    const trimMat = new THREE.MeshStandardMaterial({ color: 0x050510, roughness: 0.15, metalness: 0.7 });
    const glassMat = new THREE.MeshStandardMaterial({ color: 0x88aacc, transparent: true, opacity: 0.28, roughness: 0.05 });

    const body = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.6, 4.8), carMat);
    body.position.y = 0.62;
    body.castShadow = true;
    car.add(body);

    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.95, 0.58, 2.5), trimMat);
    cabin.position.set(0, 1.22, -0.25);
    cabin.castShadow = true;
    car.add(cabin);

    const windF = new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.52, 0.05), glassMat);
    windF.position.set(0, 1.2, 1.02);
    car.add(windF);

    const windR = new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.48, 0.05), glassMat);
    windR.position.set(0, 1.2, -1.52);
    car.add(windR);

    const hood = new THREE.Mesh(new THREE.BoxGeometry(2.25, 0.06, 1.1), carMat);
    hood.position.set(0, 0.94, 1.85);
    hood.rotation.x = 0.15;
    car.add(hood);

    const bumperF = new THREE.Mesh(new THREE.BoxGeometry(2.38, 0.28, 0.16), trimMat);
    bumperF.position.set(0, 0.36, 2.46);
    car.add(bumperF);

    const bumperR = new THREE.Mesh(new THREE.BoxGeometry(2.38, 0.28, 0.16), trimMat);
    bumperR.position.set(0, 0.36, -2.46);
    car.add(bumperR);

    [-1.17, 1.17].forEach(x => {
      const skirt = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.18, 4.4), trimMat);
      skirt.position.set(x, 0.38, 0);
      car.add(skirt);
    });

    // Wheels
    const wGeo = new THREE.CylinderGeometry(0.44, 0.44, 0.26, 20);
    const wMat = new THREE.MeshStandardMaterial({ color: 0x060606, roughness: 0.95 });
    const rGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.28, 8);
    const rMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.95, roughness: 0.05 });

    const wheelPositions = [[-1.22, 0.44, 1.5], [1.22, 0.44, 1.5], [-1.22, 0.44, -1.5], [1.22, 0.44, -1.5]];
    const wheels = [];
    wheelPositions.forEach(([x, y, z]) => {
      const w = new THREE.Mesh(wGeo, wMat);
      w.rotation.z = Math.PI / 2;
      w.position.set(x, y, z);
      w.castShadow = true;
      car.add(w);
      wheels.push(w);
      const rim = new THREE.Mesh(rGeo, rMat);
      rim.rotation.z = Math.PI / 2;
      rim.position.set(x, y, z);
      car.add(rim);
    });

    // Headlights
    const hlHouseMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.4 });
    const hlLensMat = new THREE.MeshStandardMaterial({ color: 0xd8d2c8, emissive: 0x8a8478, emissiveIntensity: 3.5 });
    [-0.75, 0.75].forEach(x => {
      const housing = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.22, 0.12), hlHouseMat);
      housing.position.set(x, 0.76, 2.46);
      car.add(housing);
      const lens = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.14, 0.07), hlLensMat);
      lens.position.set(x, 0.76, 2.5);
      car.add(lens);
    });

    // Tail lights
    const tlMat = new THREE.MeshStandardMaterial({ color: 0x6a3a3a, emissive: 0x3a2020, emissiveIntensity: 1.2 });
    [-0.75, 0.75].forEach(x => {
      const tl = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.14, 0.07), tlMat);
      tl.position.set(x, 0.76, -2.5);
      car.add(tl);
    });

    // ── SPOTLIGHTS ─────────────────────────────────────────────────────
    const makeSpot = () => {
      const s = new THREE.SpotLight(0xe8e2d8, 120, 60, Math.PI / 10, 0.15, 1.1);
      s.castShadow = true;
      s.shadow.mapSize.set(1024, 1024);
      return s;
    };
    const spotL = makeSpot(), spotR = makeSpot();
    scene.add(spotL, spotR);
    const tgtL = new THREE.Object3D(), tgtR = new THREE.Object3D();
    scene.add(tgtL, tgtR);
    spotL.target = tgtL;
    spotR.target = tgtR;

    // ── TEXT ───────────────────────────────────────────────────────────
    const fontLoader = new FontLoader();

    function addRoadText(font, text, x, z, size, rotationY, targetFacing, color, emissive) {
      const geo = new TextGeometry(text, {
        font,
        size,
        height: size * 0.26,
        curveSegments: 6,
        bevelEnabled: true,
        bevelThickness: size * 0.028,
        bevelSize: size * 0.017,
        bevelSegments: 2,
      });
      geo.computeBoundingBox();
      const textWidth = geo.boundingBox.max.x - geo.boundingBox.min.x;
      const mat = new THREE.MeshStandardMaterial({
        color,
        roughness: 0.96,
        metalness: 0.04,
        emissive,
        emissiveIntensity: 0.22,
        transparent: true,
        opacity: 0,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x - textWidth / 2, 1.0, z);
      mesh.rotation.y = rotationY;
      mesh.renderOrder = 10;
      mesh.receiveShadow = true;
      mesh.visible = false;
      mesh.userData.targetFacing = targetFacing;
      scene.add(mesh);
      return mesh;
    }

    const TEXT_FACING_THRESHOLD = 0.26;
    const roadTexts = [];

    function normalizeAngle(angle) {
      let a = angle;
      while (a > Math.PI) a -= Math.PI * 2;
      while (a < -Math.PI) a += Math.PI * 2;
      return a;
    }

    function angleDiff(a, b) {
      return Math.abs(normalizeAngle(a - b));
    }

    function updateTextVisibility(facing) {
      let best = null;
      let bestDiff = Infinity;

      roadTexts.forEach(entry => {
        const diff = angleDiff(facing, entry.targetFacing);
        if (diff < bestDiff) {
          bestDiff = diff;
          best = entry;
        }
      });

      roadTexts.forEach(entry => {
        const active = entry === best && bestDiff < TEXT_FACING_THRESHOLD;
        entry.mesh.visible = active;
        entry.mesh.material.opacity = active ? 1 : 0;
      });
    }

    fontLoader.load(
      'https://unpkg.com/three@0.158.0/examples/fonts/helvetiker_bold.typeface.json',
      font => {
        const TEXT_Z = -18;
        const CAR_START_Z = 8;
        const DZ = TEXT_Z - CAR_START_Z;
        const ARC = 0.92;

        function xForFacing(angle) {
          return DZ * Math.tan(angle);
        }

        function signAt(offset, text, size, color, emissive) {
          const angle = Math.PI + ARC * offset;
          return {
            text,
            x: xForFacing(angle),
            z: TEXT_Z,
            size,
            rot: angle - Math.PI,
            angle,
            color,
            emissive,
          };
        }

        const textSigns = [
          signAt(1, 'giving form to human thought', 0.66, 0x9eb5c9, 0x1e2a34),
          signAt(0.72, 'giving permanence to ideas', 0.64, 0x9aa8c4, 0x1e2434),
          signAt(0.48, 'to preserve ideas through art', 0.64, 0xa8b89a, 0x222a1e),
          signAt(0.24, 'creating work that stands the test of time', 0.56, 0xb0a8c8, 0x282430),
          signAt(0, 'creating art that outlives us', 0.88, 0xb8b2a8, 0x2a2820),
          signAt(-0.24, 'shaping culture through original art', 0.6, 0xa0c4b8, 0x1e2e28),
          signAt(-0.48, 'to make every work matter', 0.64, 0xc4b07a, 0x2e2818),
          signAt(-0.72, 'building a lasting artistic legacy', 0.66, 0xc9a6a0, 0x342220),
        ];

        textSigns.forEach(sign => {
          roadTexts.push({
            mesh: addRoadText(
              font, sign.text, sign.x, sign.z, sign.size, sign.rot, sign.angle,
              sign.color, sign.emissive
            ),
            targetFacing: sign.angle,
          });
        });

        updateTextVisibility(Math.PI);

        document.getElementById('loading').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('loading').remove();
        }, 1200);
      }
    );

    // ── CAR PHYSICS ────────────────────────────────────────────────────
    let carX = 0, carZ = 8;
    let velocity = 0;
    let steerAngle = 0;
    let carFacing = Math.PI;

    const ACCEL = 12;
    const FRICTION = 0.88;
    const STEER_SPEED = 2.2;
    const MAX_SPEED = 14;

    const keys = {};
    const GAME_KEYS = new Set([
      'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
      'KeyW', 'KeyA', 'KeyS', 'KeyD'
    ]);

    function isTypingInChat() {
      return document.activeElement === document.getElementById('chat-input');
    }

    window.addEventListener('keydown', e => {
      if (isTypingInChat()) return;
      if (!GAME_KEYS.has(e.code)) return;
      keys[e.code] = true;
      e.preventDefault();
    });

    window.addEventListener('keyup', e => {
      if (isTypingInChat()) return;
      if (!GAME_KEYS.has(e.code)) return;
      keys[e.code] = false;
    });

    const pad = { up: false, down: false, left: false, right: false };

    function bindDriveButton(btn, direction) {
      const press = (e) => {
        e.preventDefault();
        pad[direction] = true;
        btn.classList.add('active');
      };
      const release = (e) => {
        e.preventDefault();
        pad[direction] = false;
        btn.classList.remove('active');
      };
      btn.addEventListener('mousedown', press);
      btn.addEventListener('mouseup', release);
      btn.addEventListener('mouseleave', release);
      btn.addEventListener('touchstart', press, { passive: false });
      btn.addEventListener('touchend', release);
      btn.addEventListener('touchcancel', release);
    }

    bindDriveButton(document.getElementById('drive-up'), 'up');
    bindDriveButton(document.getElementById('drive-down'), 'down');
    bindDriveButton(document.getElementById('drive-left'), 'left');
    bindDriveButton(document.getElementById('drive-right'), 'right');

    window.addEventListener('blur', () => {
      pad.up = pad.down = pad.left = pad.right = false;
      document.querySelectorAll('.drive-btn').forEach(btn => btn.classList.remove('active'));
    });

    function driveInput() {
      return {
        forward: keys['ArrowUp'] || keys['KeyW'] || pad.up,
        reverse: keys['ArrowDown'] || keys['KeyS'] || pad.down,
        left: keys['ArrowLeft'] || keys['KeyA'] || pad.left,
        right: keys['ArrowRight'] || keys['KeyD'] || pad.right,
        active: false
      };
    }

    // ── ANIMATE ────────────────────────────────────────────────────────
    const clock = new THREE.Clock();
    const camLookAt = new THREE.Vector3(0, 1, 0);

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      const input = driveInput();
      input.active = input.forward || input.reverse || input.left || input.right;
      const usingKeys = input.active;

      document.getElementById('drive-up').classList.toggle('active', input.forward);
      document.getElementById('drive-down').classList.toggle('active', input.reverse);
      document.getElementById('drive-left').classList.toggle('active', input.left);
      document.getElementById('drive-right').classList.toggle('active', input.right);

      if (usingKeys) {
        if (input.forward) velocity = Math.min(velocity + ACCEL * dt, MAX_SPEED);
        if (input.reverse) velocity = Math.max(velocity - ACCEL * dt, -MAX_SPEED * 0.5);

        if (input.left) {
          carFacing += STEER_SPEED * dt * (Math.abs(velocity) / MAX_SPEED + 0.3);
          steerAngle = THREE.MathUtils.lerp(steerAngle, 0.3, 0.1);
        } else if (input.right) {
          carFacing -= STEER_SPEED * dt * (Math.abs(velocity) / MAX_SPEED + 0.3);
          steerAngle = THREE.MathUtils.lerp(steerAngle, -0.3, 0.1);
        } else {
          steerAngle = THREE.MathUtils.lerp(steerAngle, 0, 0.12);
        }

        velocity *= FRICTION;
        carX += Math.sin(carFacing) * velocity * dt;
        carZ += Math.cos(carFacing) * velocity * dt;

      } else {
        velocity *= FRICTION;
        steerAngle = THREE.MathUtils.lerp(steerAngle, 0, 0.12);
      }

      carX = THREE.MathUtils.clamp(carX, -9, 9);
      carZ = THREE.MathUtils.clamp(carZ, -22, 12);

      car.position.set(carX, 0, carZ);
      car.rotation.y = carFacing;
      car.rotation.z = -steerAngle * 0.07;
      car.updateMatrixWorld();

      wheels.forEach(w => { w.rotation.y += Math.abs(velocity) * dt * 3; });

      const hlL = new THREE.Vector3(-0.75, 0.76, 2.5).applyMatrix4(car.matrixWorld);
      const hlR = new THREE.Vector3(0.75, 0.76, 2.5).applyMatrix4(car.matrixWorld);
      spotL.position.copy(hlL);
      spotR.position.copy(hlR);

      const fwd = new THREE.Vector3(Math.sin(carFacing), -0.06, Math.cos(carFacing)).normalize();
      tgtL.position.copy(hlL).addScaledVector(fwd, 35);
      tgtR.position.copy(hlR).addScaledVector(fwd, 35);

      updateRoadsideArt(hlL, hlR);
      updateTextVisibility(carFacing);

      const camIdeal = new THREE.Vector3(carX, 6, carZ + 15);
      camera.position.lerp(camIdeal, 0.05);
      camLookAt.lerp(new THREE.Vector3(carX, 1.2, carZ), 0.07);
      camera.lookAt(camLookAt);

      renderer.render(scene, camera);
    }

    animate();

    function populateRoadsideArt() {
      const zPositions = [-115, -90, -70, -58, -40, -25, 10, 30, 50, 75, 100];
      zPositions.forEach((z, index) => {
        makeRoadsideObject('polka', -14 + random(-2.5, 2.5), z + random(-5, 5));
        makeRoadsideObject('lily', 14 + random(-2.5, 2.5), z + random(-5, 5));
        makeRoadsideObject('polka', -19 + random(-2, 2), z + random(-6, 6));
        makeRoadsideObject('lily', 19 + random(-2, 2), z + random(-6, 6));
        if (index % 2 === 0) {
          makeRoadsideObject('melting', -16 + random(-2.5, 2.5), z + random(-5, 5));
          makeRoadsideObject('melting', 16 + random(-2.5, 2.5), z + random(-5, 5));
        }
        if (index % 3 === 0) {
          makeRoadsideObject('polka', -11 + random(-2, 2), z + random(-4, 4));
          makeRoadsideObject('lily', 11 + random(-2, 2), z + random(-4, 4));
        }
      });
    }

    function isInTextZone(x, z) {
      return z > -22 && z < -14 && Math.abs(x) < 22;
    }

    function makeRoadsideObject(type, x, z) {
      if (isInTextZone(x, z)) z -= 30;

      const group = new THREE.Group();
      group.position.set(x, 0, z);
      group.renderOrder = 0;
      group.userData.type = type;
      const sizeScale = type === 'lily' ? random(0.8, 2.4) : type === 'polka' ? random(0.9, 2.1) : random(0.85, 2.2);
      const huge = random() < 0.24;
      const scaleBoost = huge ? random(1.6, 2.8) : 1;
      const finalScale = sizeScale * scaleBoost;

      if (type === 'polka') {
        const mat = new THREE.MeshStandardMaterial({
          color: 0x9a9590,
          emissive: 0x3a3836,
          roughness: 0.55,
          metalness: 0.15,
          emissiveIntensity: 0,
        });
        const sphere = new THREE.Mesh(new THREE.SphereGeometry(finalScale * 0.9, 24, 24), mat);
        sphere.castShadow = true;
        sphere.receiveShadow = true;
        group.add(sphere);

        const dotMat = new THREE.MeshStandardMaterial({
          color: 0xd8d4cc,
          emissive: 0x6a6660,
          emissiveIntensity: 0,
          roughness: 1,
          metalness: 0,
        });
        const dotCount = max(3, floor(3 + finalScale));
        for (let i = 0; i < dotCount; i++) {
          const dot = new THREE.Mesh(new THREE.SphereGeometry(0.18 * finalScale, 16, 16), dotMat);
          dot.position.set((random() - 0.5) * finalScale, (random() - 0.2) * finalScale, (random() - 0.5) * finalScale);
          group.add(dot);
        }
      } else if (type === 'lily') {
        const mat = new THREE.MeshStandardMaterial({
          color: 0x8a9088,
          emissive: 0x2e322e,
          roughness: 0.6,
          metalness: 0.1,
          emissiveIntensity: 0,
        });
        const pad = new THREE.Mesh(new THREE.CylinderGeometry(finalScale * 1.2, finalScale * 1.2, 0.12 * finalScale, 32), mat);
        pad.rotation.x = -Math.PI / 2;
        pad.position.y = 0.08 * finalScale;
        pad.castShadow = true;
        pad.receiveShadow = true;
        group.add(pad);

        const leafMat = new THREE.MeshStandardMaterial({
          color: 0x747870,
          emissive: 0x282a28,
          roughness: 0.65,
          metalness: 0.08,
          emissiveIntensity: 0,
        });
        for (let i = 0; i < 3; i++) {
          const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.7 * finalScale, 16, 16), leafMat);
          leaf.scale.set(1, 0.14, 1);
          leaf.position.set(Math.cos((Math.PI * 2 * i) / 3) * finalScale * 1.1, 0.12 * finalScale, Math.sin((Math.PI * 2 * i) / 3) * finalScale * 1.1);
          leaf.castShadow = true;
          group.add(leaf);
        }
      } else if (type === 'melting') {
        const mat = new THREE.MeshStandardMaterial({
          color: 0xa09888,
          emissive: 0x3a3530,
          roughness: 0.55,
          metalness: 0.12,
          emissiveIntensity: 0,
        });
        const ring = new THREE.Mesh(new THREE.TorusGeometry(finalScale * 0.9, 0.18 * finalScale, 16, 50), mat);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = 0.8 * finalScale;
        ring.castShadow = true;
        group.add(ring);

        const faceMat = new THREE.MeshStandardMaterial({
          color: 0xc8c2b8,
          emissive: 0x5a5650,
          emissiveIntensity: 0,
          roughness: 0.7,
          metalness: 0,
        });
        const face = new THREE.Mesh(new THREE.CircleGeometry(finalScale * 0.7, 32), faceMat);
        face.rotation.x = -Math.PI / 2;
        face.position.y = 0.86 * finalScale;
        face.castShadow = true;
        group.add(face);

        const drip = new THREE.Mesh(new THREE.BoxGeometry(0.18 * finalScale, 0.18 * finalScale, 0.5 * finalScale), faceMat);
        drip.position.set(0.55 * finalScale, 0.45 * finalScale, 0);
        drip.rotation.z = 0.35;
        drip.castShadow = true;
        group.add(drip);
      }

      scene.add(group);
      roadsideObjects.push(group);
    }

    function getSpotIntensity(spot, worldPos) {
      const lightDir = new THREE.Vector3().subVectors(spot.target.position, spot.position).normalize();
      const toPoint = new THREE.Vector3().subVectors(worldPos, spot.position);
      const distance = toPoint.length();
      if (distance > spot.distance) return 0;
      const directionToPoint = toPoint.normalize();
      const coneDot = lightDir.dot(directionToPoint);
      if (coneDot < Math.cos(spot.angle)) return 0;
      return Math.max(0, (1 - distance / spot.distance) * coneDot);
    }

    function updateRoadsideArt(hlL, hlR) {
      roadsideObjects.forEach(group => {
        const worldPos = new THREE.Vector3();
        group.getWorldPosition(worldPos);
        const leftIntensity = getSpotIntensity(spotL, worldPos);
        const rightIntensity = getSpotIntensity(spotR, worldPos);
        const spotVisibility = Math.min(1, leftIntensity + rightIntensity);
        const visible = debugRoadsideTimer > 0 || spotVisibility > 0.03;

        group.traverse(child => {
          if (!child.material) return;
          child.visible = visible;
          child.material.emissiveIntensity = debugRoadsideTimer > 0 ? 1.2 : spotVisibility * 2.2;
          child.material.opacity = visible ? 1 : 0;
        });
      });
      debugRoadsideTimer = Math.max(0, debugRoadsideTimer - 0.01);
    }
  </script>
