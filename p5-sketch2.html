<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2D Canvas.2</title>
    <link rel="stylesheet" href="site-chat.css">
    <link rel="stylesheet" href="site-nav.css">
    <link rel="stylesheet" href="canvas-base.css">
    <style>
        :root {
            color-scheme: dark;
            --paper: #f3efe4;
            --paper-shadow: rgba(0, 0, 0, 0.28);
            --ink: #18243a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            color: #f2f2f2;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
            padding: calc(var(--site-nav-height, 48px) + 20px) 20px 32px;
        }

        .page {
            position: relative;
            z-index: 2;
            width: min(1120px, 96vw);
        }

        .topbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 18px;
            gap: 16px;
            padding-right: 120px;
        }

        #sketch-status {
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
            min-height: 1em;
        }

        #speed-2x-btn {
            position: fixed;
            top: calc(var(--site-nav-height, 48px) + 10px);
            right: 24px;
            z-index: 1100;
            border: 1px solid rgba(255, 255, 255, 0.22);
            background: rgba(0, 0, 0, 0.72);
            color: rgba(255, 255, 255, 0.82);
            padding: 8px 14px;
            font-family: var(--site-font, 'Instrument Sans', sans-serif);
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        #speed-2x-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.35);
        }

        #speed-2x-btn.is-active {
            background: rgba(142, 197, 255, 0.14);
            border-color: rgba(142, 197, 255, 0.45);
            color: rgba(210, 232, 255, 0.95);
        }

        .canvas-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(28px, 5vw, 56px);
            flex-wrap: wrap;
        }

        .paper-wrap {
            flex: 1 1 380px;
            max-width: 640px;
            filter: drop-shadow(0 22px 48px var(--paper-shadow));
        }

        #sketch-stage {
            position: relative;
            width: 100%;
            min-height: 420px;
            padding: clamp(22px, 4vw, 36px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background-color: var(--paper);
            background-image:
                radial-gradient(rgba(0, 0, 0, 0.03) 0.6px, transparent 0.6px),
                linear-gradient(145deg, rgba(255, 255, 255, 0.35) 0%, transparent 42%);
            background-size: 4px 4px, 100% 100%;
            clip-path: polygon(
                1.5% 2%, 6% 0.5%, 11% 2.5%, 17% 0.8%, 23% 2%, 29% 0.4%, 35% 2.2%, 41% 0.6%, 47% 1.8%, 53% 0.3%, 59% 2.4%, 65% 0.7%, 71% 1.9%, 77% 0.5%, 83% 2.6%, 89% 1%, 95% 2.2%, 98.5% 5%,
                99.5% 11%, 98% 17%, 99.8% 23%, 98.2% 29%, 99.6% 35%, 97.8% 41%, 99.4% 47%, 98% 53%, 99.7% 59%, 97.5% 65%, 99.2% 71%, 98.4% 77%, 99.8% 83%, 97% 89%, 99.5% 95%,
                96% 98.5%, 90% 99.2%, 84% 97.5%, 78% 99.6%, 72% 98%, 66% 99.4%, 60% 97.8%, 54% 99.5%, 48% 98.2%, 42% 99.6%, 36% 97.4%, 30% 99.2%, 24% 98.5%, 18% 99.7%, 12% 97.2%, 6% 99%, 2% 96%,
                0.5% 90%, 2.2% 84%, 0.8% 78%, 2.5% 72%, 0.4% 66%, 2.1% 60%, 0.6% 54%, 2.4% 48%, 0.3% 42%, 2% 36%, 0.7% 30%, 2.3% 24%, 0.5% 18%, 2.6% 12%, 0.9% 6%
            );
        }

        .making-copy {
            flex: 0 1 260px;
            margin: 0;
            padding: 0;
            font-size: clamp(0.78rem, 1.4vw, 0.92rem);
            line-height: 1.65;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.62);
            max-width: 22ch;
        }

        .making-copy .sketch-hint {
            display: block;
            margin-top: 1.1em;
            font-size: 0.85em;
            letter-spacing: 0.14em;
            color: rgba(255, 255, 255, 0.42);
        }

        .sketch-svg {
            display: block;
            width: 100%;
            height: auto;
            max-height: min(72vh, 760px);
            opacity: 0;
            overflow: visible;
            border: none;
            outline: none;
        }

        .sketch-svg.is-drawing {
            opacity: 1;
        }

        .sketch-svg path,
        .sketch-svg line,
        .sketch-svg polyline,
        .sketch-svg polygon {
            fill: none !important;
            stroke: #18243a;
        }

        .sketch-svg rect {
            display: none;
        }

        .sketch-canvas-fallback {
            display: block;
            width: 100%;
            height: auto;
            max-height: min(72vh, 760px);
            background: transparent;
            border: none;
        }

        @media (max-width: 820px) {
            .canvas-layout {
                flex-direction: column;
                align-items: stretch;
            }

            .paper-wrap {
                max-width: none;
            }

            .making-copy {
                flex-basis: auto;
                max-width: none;
                text-align: center;
                align-self: center;
            }
        }
    </style>
</head>

<body class="has-canvas-base">
    <div class="canvas-base" aria-hidden="true"></div>

    <button type="button" id="speed-2x-btn" aria-pressed="false">2× Speed</button>

    <div class="page">
        <div class="topbar">
            <span id="sketch-status" aria-live="polite">Loading sketch…</span>
        </div>

        <div class="canvas-layout">
            <div class="paper-wrap">
                <div id="sketch-stage" aria-busy="true" title="Double-click to replay"></div>
            </div>
            <p class="making-copy">Watch the making of the art that could be yours<span class="sketch-hint">Double-click sketch to replay</span></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.min.js"></script>
    <script src="sketch2.js"></script>
    <script src="site-nav.js"></script>
    <script src="site-chat.js"></script>
    <script src="chatbot.js"></script>
</body>

</html>
